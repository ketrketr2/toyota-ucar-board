<style>
:root{--bg:#F5F4F0;--surface:#FFFFFF;--ink:#1B1F27;--sub:#475063;--mute:#7B8394;--rule:#E3E1DA;--accent:#C8102E;--err:#B03A2E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111318;--surface:#181B22;--ink:#ECEEF2;--sub:#B6BCC8;--mute:#8A91A0;--rule:#2B303B;--accent:#FF5A6E;--err:#F07467}}
:root[data-theme="dark"]{--bg:#111318;--surface:#181B22;--ink:#ECEEF2;--sub:#B6BCC8;--mute:#8A91A0;--rule:#2B303B;--accent:#FF5A6E;--err:#F07467}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden;max-width:100%}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:'BIZ UDGothic','Hiragino Sans',Meiryo,sans-serif}
.card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:30px 28px 24px;box-shadow:0 10px 30px rgba(20,24,33,.08)}
.k{font-size:12px;color:var(--mute);letter-spacing:.06em}
h1{font-size:20px;line-height:1.45;margin:4px 0 6px}
h1 span{color:var(--accent)}
.lead{font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:18px}
label{display:block;font-size:12px;color:var(--sub);margin:12px 0 6px;font-weight:700}
input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--bg);color:var(--ink);outline:none}
input:focus{border-color:var(--accent)}
button{width:100%;margin-top:20px;font:inherit;font-weight:700;font-size:15px;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--err);font-size:12.5px;min-height:18px;margin-top:12px;text-align:center}
.ft{font-size:11px;color:var(--mute);text-align:center;margin-top:16px;line-height:1.7}
</style>

    <div class="err" id="e" role="alert"></div>

const ITER=200000;
function b64d(s){const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
async function decrypt(u,p){
 const data=b64d(BLOB);
 const salt=data.slice(0,16), iv=data.slice(16,28), ct=data.slice(28);
 const enc=new TextEncoder();
 const km=await crypto.subtle.importKey('raw',enc.encode(u+':'+p),{name:'PBKDF2'},false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
 const ds=new DecompressionStream('gzip');
 const stream=new Blob([plain]).stream().pipeThrough(ds);
 return await new Response(stream).text();
}
