<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{overflow-x:hidden;max-width:100%;}
@media(max-width:900px){input{font-size:16px!important;}}
body{min-height:100vh;display:grid;place-items:center;padding:24px;
 background:radial-gradient(1000px 620px at 50% -8%, #0F3A36 0%, transparent 58%), #0A0D13;
 color:#F3F6FB;font-family:'BIZ UDPGothic','BIZ UDGothic','Hiragino Sans',Meiryo,sans-serif;}
.card{width:100%;max-width:400px;background:linear-gradient(160deg,#141B2A,#11151E 65%);border:1px solid #232A38;border-radius:18px;
 padding:34px 30px 28px;box-shadow:0 30px 80px rgba(2,7,16,.6);position:relative;overflow:hidden;}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#4FD1C5,transparent 75%);}
.mk{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;margin-bottom:16px;}
h1{font-size:20px;letter-spacing:.05em;} h1 span{color:#4FD1C5;}
.sub{font-size:11px;color:#71809A;letter-spacing:.16em;margin-top:3px;margin-bottom:24px;font-family:'JetBrains Mono',monospace;}
label{display:block;font-size:11px;color:#AAB4C6;margin:14px 0 6px;font-weight:700;}
input{width:100%;background:#0B0F17;border:1px solid #33405A;color:#F3F6FB;font-family:inherit;font-size:14px;padding:12px 14px;border-radius:10px;outline:none;transition:.15s;}
input:focus{border-color:#4FD1C5;box-shadow:0 0 0 3px rgba(79,209,197,.16);}
button{width:100%;margin-top:22px;background:linear-gradient(145deg,#4FD1C5,#2FB3A6);color:#04221F;border:none;font-family:inherit;font-weight:800;font-size:14px;letter-spacing:.05em;padding:13px;border-radius:10px;cursor:pointer;transition:.15s;}
button:hover{filter:brightness(1.08);} button:disabled{opacity:.6;cursor:wait;}
.err{color:#FF6B7A;font-size:12px;margin-top:14px;min-height:16px;text-align:center;}
.ft{font-size:10px;color:#71809A;text-align:center;margin-top:20px;line-height:1.7;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(4,18,26,.35);border-top-color:#04221F;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>

    <button id="b" type="submit">ログイン</button>

const ITER=200000;
function b64d(s){const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
async function decrypt(u,p){
 const data=b64d(BLOB);
 const salt=data.slice(0,16), iv=data.slice(16,28), ct=data.slice(28);
 const enc=new TextEncoder();
 const km=await crypto.subtle.importKey('raw',enc.encode(u+':'+p),{name:'PBKDF2'},false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
 const ds=new DecompressionStream('gzip');
 const stream=new Blob([plain]).stream().pipeThrough(ds);
 return await new Response(stream).text();
}
const f=document.getElementById('f'),e=document.getElementById('e'),b=document.getElementById('b');
f.addEventListener('submit',async ev=>{
 ev.preventDefault();
 const u=document.getElementById('u').value.trim(), p=document.getElementById('p').value;
 if(!u||!p){e.textContent='IDとパスワードを入力してください';return;}
 b.disabled=true;b.innerHTML='<span class="spin"></span>復号中…';e.textContent='';
 try{
   const html=await decrypt(u,p);
   if(html.indexOf('UCAR_BOARD')===-1) throw new Error('bad');
   document.open();document.write(html);document.close();
 }catch(err){
   e.textContent='IDまたはパスワードが正しくありません';
   b.disabled=false;b.textContent='ログイン';
 }
});
document.getElementById('u').focus();
